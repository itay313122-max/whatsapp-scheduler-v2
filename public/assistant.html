<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <title>העוזר החכם</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <style>
    :root {
      --bg: #0b1020;
      --bg2: #131a2e;
      --card: rgba(255, 255, 255, 0.06);
      --text: #eaf0ff;
      --muted: #9aa6c7;
      --accent: #6ea8ff;
      --accent2: #9b7bff;
      --user: #2a63d8;
      --ok: #34d399;
      --warn: #fbbf24;
      --err: #f87171;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
      background: radial-gradient(1200px 800px at 80% -10%, #1c2748 0%, transparent 60%),
                  radial-gradient(1000px 700px at -10% 110%, #24123f 0%, transparent 55%),
                  var(--bg);
      display: flex; flex-direction: column;
      min-height: 100dvh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    header {
      display: flex; align-items: center; gap: 10px;
      padding: 16px 18px 8px;
    }
    header .logo {
      width: 34px; height: 34px; border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: grid; place-items: center; font-size: 18px;
      box-shadow: 0 6px 20px rgba(110, 168, 255, 0.35);
    }
    header h1 { font-size: 18px; margin: 0; font-weight: 650; letter-spacing: .2px; }
    header .status { margin-inline-start: auto; font-size: 12px; color: var(--muted); display: flex; gap: 12px; }
    header .dot { display: inline-flex; align-items: center; gap: 5px; }
    header .dot i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
    header .dot.on i { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
    header .dot.off i { background: var(--err); }

    #chat {
      flex: 1; overflow-y: auto; padding: 12px 16px 8px;
      display: flex; flex-direction: column; gap: 12px;
      scroll-behavior: smooth;
    }
    .msg { max-width: 84%; padding: 11px 14px; border-radius: 18px; line-height: 1.5; font-size: 15.5px;
           white-space: pre-wrap; word-wrap: break-word; animation: pop .18s ease; }
    @keyframes pop { from { transform: translateY(6px); opacity: 0; } to { transform: none; opacity: 1; } }
    .msg.user { align-self: flex-start; background: linear-gradient(135deg, var(--user), #3b7ae0); color: #fff; border-bottom-inline-start-radius: 6px; }
    .msg.bot { align-self: flex-end; background: var(--card); border: 1px solid rgba(255,255,255,.08); border-bottom-inline-end-radius: 6px; }
    .msg.sys { align-self: center; background: transparent; color: var(--muted); font-size: 13px; text-align: center; }
    .typing { align-self: flex-end; display: inline-flex; gap: 5px; padding: 14px; }
    .typing span { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite both; }
    .typing span:nth-child(2){ animation-delay:.2s } .typing span:nth-child(3){ animation-delay:.4s }
    @keyframes blink { 0%,80%,100%{opacity:.3} 40%{opacity:1} }

    .empty { margin: auto; text-align: center; color: var(--muted); padding: 20px; }
    .empty .big { font-size: 22px; color: var(--text); margin-bottom: 8px; font-weight: 600; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
    .chip { background: var(--card); border: 1px solid rgba(255,255,255,.1); color: var(--text);
            padding: 8px 12px; border-radius: 999px; font-size: 13.5px; cursor: pointer; }
    .chip:active { transform: scale(.96); }

    footer { padding: 10px 16px calc(14px + env(safe-area-inset-bottom)); }
    .composer { display: flex; align-items: center; gap: 10px; }
    .composer input {
      flex: 1; background: var(--card); border: 1px solid rgba(255,255,255,.12);
      color: var(--text); border-radius: 999px; padding: 13px 16px; font-size: 15px; outline: none;
    }
    .composer input::placeholder { color: var(--muted); }
    .iconbtn {
      width: 48px; height: 48px; border-radius: 50%; border: none; cursor: pointer; flex: 0 0 auto;
      display: grid; place-items: center; color: #fff; font-size: 20px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow: 0 6px 18px rgba(110,168,255,.35); transition: transform .1s;
    }
    .iconbtn:active { transform: scale(.94); }
    .iconbtn.send { background: rgba(255,255,255,.1); box-shadow: none; }
    .mic { position: relative; }
    .mic.listening { background: linear-gradient(135deg, var(--err), #ff7ab6); }
    .mic.listening::after {
      content: ""; position: absolute; inset: -6px; border-radius: 50%;
      border: 2px solid var(--err); animation: ring 1.2s ease-out infinite;
    }
    @keyframes ring { from { transform: scale(1); opacity:.7 } to { transform: scale(1.5); opacity:0 } }
    .toolbar { display: flex; gap: 8px; align-items: center; margin-top: 10px; justify-content: center; font-size: 12.5px; color: var(--muted); }
    .toolbar label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
    .banner { margin: 0 16px 8px; padding: 10px 12px; border-radius: 12px; font-size: 13px;
              background: rgba(251,191,36,.12); border: 1px solid rgba(251,191,36,.35); color: #ffe6a3; display: none; }
  </style>
</head>
<body>
  <header>
    <div class="logo">🎙️</div>
    <h1>העוזר החכם</h1>
    <div class="status">
      <span class="dot" id="dotAI"><i></i>AI</span>
      <span class="dot" id="dotWA"><i></i>WhatsApp</span>
    </div>
  </header>

  <div class="banner" id="banner"></div>

  <div id="chat">
    <div class="empty" id="empty">
      <div class="big">שלום 👋 אני מקשיב.</div>
      <div>דבר איתי או כתוב, ואבצע לפי הבקשה.</div>
      <div class="chips" id="chips">
        <div class="chip">מה מזג האוויר מחר בתל אביב?</div>
        <div class="chip">שלח לאמא הודעה שאני בדרך</div>
        <div class="chip">תזכיר לי מחר ב-9 להתקשר לרופא</div>
        <div class="chip">מה החדשות האחרונות בטכנולוגיה?</div>
      </div>
    </div>
  </div>

  <footer>
    <div class="composer">
      <button class="iconbtn mic" id="micBtn" title="דבר">🎤</button>
      <input id="input" placeholder="כתוב הודעה…" autocomplete="off" />
      <button class="iconbtn send" id="sendBtn" title="שלח">➤</button>
    </div>
    <div class="toolbar">
      <label><input type="checkbox" id="ttsToggle" checked /> קול (הקראה)</label>
      <label>שפה:
        <select id="lang" style="background:transparent;color:var(--muted);border:none;">
          <option value="he-IL">עברית</option>
          <option value="en-US">English</option>
        </select>
      </label>
    </div>
  </footer>

  <script>
    const chat = document.getElementById('chat');
    const empty = document.getElementById('empty');
    const input = document.getElementById('input');
    const micBtn = document.getElementById('micBtn');
    const sendBtn = document.getElementById('sendBtn');
    const ttsToggle = document.getElementById('ttsToggle');
    const langSel = document.getElementById('lang');
    const banner = document.getElementById('banner');

    // Full API conversation history (may contain tool blocks) — sent back each turn.
    let history = [];
    let busy = false;

    // ── UI helpers ──────────────────────────────────────────────
    function addBubble(text, cls) {
      if (empty) empty.style.display = 'none';
      const el = document.createElement('div');
      el.className = 'msg ' + cls;
      el.textContent = text;
      chat.appendChild(el);
      chat.scrollTop = chat.scrollHeight;
      return el;
    }
    function showTyping() {
      const el = document.createElement('div');
      el.className = 'typing msg bot';
      el.innerHTML = '<span></span><span></span><span></span>';
      chat.appendChild(el);
      chat.scrollTop = chat.scrollHeight;
      return el;
    }

    // ── Text-to-speech ──────────────────────────────────────────
    function speak(text) {
      if (!ttsToggle.checked || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = langSel.value;
      u.rate = 1.02;
      window.speechSynthesis.speak(u);
    }

    // ── Send a message to the assistant ─────────────────────────
    async function send(text) {
      text = (text || '').trim();
      if (!text || busy) return;
      busy = true;
      window.speechSynthesis && window.speechSynthesis.cancel();
      addBubble(text, 'user');
      history.push({ role: 'user', content: text });
      input.value = '';
      const typing = showTyping();
      try {
        const res = await fetch('/api/assistant', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ history }),
        });
        const data = await res.json();
        typing.remove();
        if (!res.ok) {
          const m = data.code === 'NO_API_KEY'
            ? 'המוח (Claude) עדיין לא מחובר. הגדירו ANTHROPIC_API_KEY בשרת.'
            : ('שגיאה: ' + (data.error || res.status));
          addBubble(m, 'sys');
          history.pop();
          return;
        }
        history = data.history; // keep full history incl. tool blocks
        addBubble(data.reply, 'bot');
        speak(data.reply);
      } catch (err) {
        typing.remove();
        addBubble('שגיאת רשת: ' + err.message, 'sys');
        history.pop();
      } finally {
        busy = false;
      }
    }

    sendBtn.addEventListener('click', () => send(input.value));
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(input.value); });
    document.getElementById('chips').addEventListener('click', (e) => {
      if (e.target.classList.contains('chip')) send(e.target.textContent);
    });

    // ── Speech recognition (voice input) ────────────────────────
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recog = null, listening = false;
    if (SR) {
      recog = new SR();
      recog.continuous = false;
      recog.interimResults = true;
      recog.onresult = (e) => {
        let t = '';
        for (let i = e.resultIndex; i < e.results.length; i++) t += e.results[i][0].transcript;
        input.value = t;
        if (e.results[e.results.length - 1].isFinal) { stopListening(); send(t); }
      };
      recog.onerror = () => stopListening();
      recog.onend = () => stopListening();
    } else {
      micBtn.style.display = 'none';
    }
    function startListening() {
      if (!recog || listening) return;
      recog.lang = langSel.value;
      try { recog.start(); listening = true; micBtn.classList.add('listening'); } catch {}
    }
    function stopListening() {
      listening = false; micBtn.classList.remove('listening');
      try { recog && recog.stop(); } catch {}
    }
    micBtn.addEventListener('click', () => (listening ? stopListening() : startListening()));

    // ── Status / config ─────────────────────────────────────────
    async function loadConfig() {
      try {
        const c = await (await fetch('/api/assistant/config')).json();
        document.getElementById('dotAI').className = 'dot ' + (c.aiConfigured ? 'on' : 'off');
        document.getElementById('dotWA').className = 'dot ' + (c.whatsapp === 'connected' ? 'on' : 'off');
        if (!c.aiConfigured) {
          banner.style.display = 'block';
          banner.textContent = 'המוח (Claude) עדיין לא מחובר — הגדירו את משתנה הסביבה ANTHROPIC_API_KEY בשרת כדי להפעיל.';
        }
      } catch {}
    }
    loadConfig();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
  </script>
</body>
</html>
